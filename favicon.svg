<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1713"/>
      <stop offset="65%" stop-color="#100C09"/>
      <stop offset="100%" stop-color="#060504"/>
    </radialGradient>

    <!-- Champagne Metallic Gold Gradient (High Lustre) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0D7"/>
      <stop offset="22%" stop-color="#E8CFA0"/>
      <stop offset="48%" stop-color="#C59B48"/>
      <stop offset="75%" stop-color="#F5E4BE"/>
      <stop offset="100%" stop-color="#936F2B"/>
    </linearGradient>

    <!-- Hairline Accent Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#936F2B"/>
      <stop offset="35%" stop-color="#FAF0D7"/>
      <stop offset="70%" stop-color="#E8CFA0"/>
      <stop offset="100%" stop-color="#C59B48"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FAF0D7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>

  <!-- Outer Hairline Accent Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldHighlight)" stroke-width="2" opacity="0.75"/>

  <!-- Inner Satin Gold Rim Ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Cardinal Accent Dots -->
  <circle cx="256" cy="28" r="4" fill="url(#goldGrad)"/>
  <circle cx="256" cy="484" r="4" fill="url(#goldGrad)"/>
  <circle cx="484" cy="256" r="4" fill="url(#goldGrad)"/>
  <circle cx="28" cy="256" r="4" fill="url(#goldGrad)"/>

  <!-- Central Monogram & Star Group -->
  <g filter="url(#luxuryGlow)">
    <!-- Vector 'O' (Left Serif) -->
    <path d="M 162 150 
             C 108 150, 80 192, 80 256 
             C 80 320, 108 362, 162 362 
             C 216 362, 244 320, 244 256 
             C 244 192, 216 150, 162 150 Z 
             M 162 176 
             C 192 176, 208 206, 208 256 
             C 208 306, 192 336, 162 336 
             C 132 336, 116 306, 116 256 
             C 116 206, 132 176, 162 176 Z" 
          fill="url(#goldGrad)"/>

    <!-- Central 8-Point Diamond Star Divider Motif -->
    <g transform="translate(256, 256)">
      <path d="M 0 -42 L 8 -12 L 38 0 L 8 12 L 0 42 L -8 12 L -38 0 L -8 -12 Z" fill="url(#goldGrad)"/>
      <path d="M 0 0 L 18 -18 M 0 0 L 18 18 M 0 0 L -18 18 M 0 0 L -18 -18" stroke="url(#goldHighlight)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3.5" fill="#FAF0D7"/>
    </g>

    <!-- Vector 'H' (Right Serif Architecture) -->
    <path d="M 268 156 
             L 306 156 
             L 306 238 
             L 358 238 
             L 358 156 
             L 396 156 
             L 396 170 
             L 380 170 
             L 380 342 
             L 396 342 
             L 396 356 
             L 358 356 
             L 358 342 
             L 374 342 
             L 374 254 
             L 306 254 
             L 306 342 
             L 322 342 
             L 322 356 
             L 268 356 
             L 268 342 
             L 284 342 
             L 284 170 
             L 268 170 Z" 
          fill="url(#goldGrad)"/>

    <!-- Bottom Luxury Accent Line & Center Dot -->
    <path d="M 145 402 L 215 402 M 297 402 L 367 402" stroke="url(#goldHighlight)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="256" cy="402" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="135" cy="402" r="2" fill="url(#goldGrad)"/>
    <circle cx="377" cy="402" r="2" fill="url(#goldGrad)"/>
  </g>
</svg>